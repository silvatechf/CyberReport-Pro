[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberreport-pro"
version = "0.1.0"
description = "Motor de automação que traduz achados técnicos de segurança em relatórios executivos mapeados ao ENS e ao RGPD/LOPDGDD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seu Nome" }]
keywords = ["security", "compliance", "ens", "rgpd", "devsecops", "reporting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "weasyprint>=61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "bandit>=1.7",
    "mypy>=1.10",
]

[project.scripts]
cyberreport-pro = "cyberreport_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberreport_pro = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cyberreport_pro --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
